[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-spatial-state"
version = "0.1.0"
description = "Spatial 2D hidden-state mechanics and reproducible notebook experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "pillow>=10"]

[project.scripts]
nr2d = "nr2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
